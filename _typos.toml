# US spelling everywhere.
[default]
locale = "en-us"
# ND is the no-derivatives part of Creative Commons SPDX ids; harbour-exception is an SPDX exception id.
extend-ignore-re = ["CC-BY(-NC)?-ND-[0-9.]+", "harbour-exception"]

# axe is the name of the accessibility test engine.
[default.extend-words]
axe = "axe"

[files]
extend-exclude = [
  "pnpm-lock.yaml",
  "LICENSES/",
  "LICENSE",
  "packages/contracts/schemas/",
  "apps/collector/src/license-templates.json",
]
