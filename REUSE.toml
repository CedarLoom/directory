version = 1

# A license text goes into LICENSES/ with the first file that uses it; `reuse lint` names it when it is missing.

# Code, site text and everything not matched below: ISC.
[[annotations]]
path = "**"
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Eike Landin"
SPDX-License-Identifier = "ISC"

# The SPDX License List exception ids, copied from the list and written into the pattern of the record schemas.
[[annotations]]
path = "packages/contracts/src/spdx-exception-ids.ts"
precedence = "override"
SPDX-FileCopyrightText = "Linux Foundation and its Contributors"
SPDX-License-Identifier = "CC-BY-3.0"

# The SPDX License List license templates, copied to name a license file by its text: the field
# standardLicenseTemplate of json/details/<id>.json in https://github.com/spdx/license-list-data, version 3.29.0,
# unchanged, for the license ids of the collector's class table. The list and its matching markup are licensed
# under CC-BY-3.0. Each template reproduces a license text that belongs to its steward (the copyright line is in the
# text where the steward gives one) and stays under the terms that text states for itself: the GNU licenses, among
# others, allow verbatim copies only. Never edit a value; replace the file from a newer list version instead.
[[annotations]]
path = "apps/collector/src/license-templates.json"
precedence = "override"
SPDX-FileCopyrightText = "Linux Foundation and its Contributors"
SPDX-License-Identifier = "CC-BY-3.0"

# The SPDX License List full license names, copied from the list to read a license stated by its name.
[[annotations]]
path = "apps/collector/src/license-names.json"
precedence = "override"
SPDX-FileCopyrightText = "Linux Foundation and its Contributors"
SPDX-License-Identifier = "CC-BY-3.0"

[[annotations]]
path = [
  "packages/contracts/schemas/v1/agent.schema.json",
  "packages/contracts/schemas/v1/hook.schema.json",
  "packages/contracts/schemas/v1/marketplace.schema.json",
  "packages/contracts/schemas/v1/mcp-server.schema.json",
  "packages/contracts/schemas/v1/output-style.schema.json",
  "packages/contracts/schemas/v1/plugin.schema.json",
  "packages/contracts/schemas/v1/skill.schema.json",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "Linux Foundation and its Contributors"
SPDX-License-Identifier = "CC-BY-3.0"

# Own records (facts, scores, flags, tags), rubrics and curation files: CC0 1.0.
[[annotations]]
path = ["data/**", "rubrics/**", "curation/**"]
precedence = "override"
SPDX-FileCopyrightText = "2026 Eike Landin"
SPDX-License-Identifier = "CC0-1.0"

# The license notice of the Inter font, copied from the Inter repository; the site ships it with the font files.
[[annotations]]
path = "apps/site/public/licenses/inter-ofl.txt"
precedence = "override"
SPDX-FileCopyrightText = "2016 The Inter Project Authors"
SPDX-License-Identifier = "OFL-1.1"

# Names and logos: not licensed.
[[annotations]]
path = ["apps/site/src/assets/brand/**", "apps/site/public/favicon.svg"]
precedence = "override"
SPDX-FileCopyrightText = "2026 Eike Landin"
SPDX-License-Identifier = "LicenseRef-Brand"
