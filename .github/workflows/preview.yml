name: Preview

# Builds the site of a pull request from this repository with the base URL of its preview and publishes it to
# pr-preview/pr-<number>/ on the gh-pages branch with one sticky comment that links it; preview-cleanup.yml removes it
# when the pull request closes. The build runs with a read-only token; the publish job runs no code from the pull
# request. Pull requests from forks get no preview: their token cannot write. The paths match pages.yml.
on:
  pull_request:
    types: [opened, reopened, synchronize]
    paths:
      - "apps/site/**"
      - "packages/**"
      - "rubrics/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/actions/**"
      - ".github/workflows/preview.yml"

permissions: {}

# Shared with preview-cleanup.yml, so a removal waits for a running deploy.
concurrency:
  group: Preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    if: github.repository == 'CedarLoom/directory' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/site-build
        with:
          base-url: /directory/pr-preview/pr-${{ github.event.pull_request.number }}/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site
          path: apps/site/dist/client
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  preview:
    if: github.repository == 'CedarLoom/directory' && github.event.pull_request.head.repo.full_name == github.repository
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      # The preview action pushes to gh-pages from this checkout with its own token.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site
          path: apps/site/dist/client
      - uses: rossjrw/pr-preview-action@873417d2df72380da1f3978378fb58560bcde976 # v1.8.2
        with:
          action: deploy
          source-dir: apps/site/dist/client
