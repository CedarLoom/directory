name: Refresh

# Collects the items, validates the run against the published data, publishes it to the data branch and deploys the
# site from it. A failed step stops the run before the push, so the data branch keeps the last published data.
on:
  schedule:
    - cron: "17 4 * * *"
      timezone: Europe/Berlin
  workflow_dispatch:

permissions: {}

# Two refreshes never push the data branch at once; a running refresh is never cancelled. Pages, which this workflow
# calls, holds the group of its deploys from main, which its own runs share.
concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  collect:
    # Pages deploys only from main, so a refresh from another branch would publish data the site never shows.
    if: github.repository == 'CedarLoom/directory' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # The request caps allow 2,600 requests at one a second, plus the waits of the retries.
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - id: data
        uses: ./.github/actions/data-branch
      - name: The published data folder
        env:
          EXISTS: ${{ steps.data.outputs.exists }}
        run: |
          mkdir -p "$RUNNER_TEMP/published" "$RUNNER_TEMP/run"
          if [ "$EXISTS" = true ]; then git archive origin/data | tar -x -C "$RUNNER_TEMP/published"; fi
      - name: Collect
        env:
          GITHUB_TOKEN: ${{ github.token }}
          EXCLUSIONS_KEY: ${{ secrets.EXCLUSIONS_KEY }}
        run: >-
          node apps/collector/src/index.ts collect --out "$RUNNER_TEMP/run/candidate" --previous "$RUNNER_TEMP/published"
          > "$RUNNER_TEMP/run/report.json"
      - name: Validate
        run: >-
          node apps/collector/src/index.ts validate --candidate "$RUNNER_TEMP/run/candidate"
          --report "$RUNNER_TEMP/run/report.json" --published "$RUNNER_TEMP/published"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: run
          path: ${{ runner.temp }}/run
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: collect
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      # Pushes the data branch.
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The push of the data branch uses these credentials; this job runs only the repository's own code.
          persist-credentials: true
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: run
          path: ${{ runner.temp }}/run
      - id: data
        uses: ./.github/actions/data-branch
      - name: A work tree of the data branch, which the first refresh starts
        env:
          EXISTS: ${{ steps.data.outputs.exists }}
        run: |
          if [ "$EXISTS" = true ]; then
            git worktree add -b data "$RUNNER_TEMP/published" origin/data
          else
            git worktree add --orphan -b data "$RUNNER_TEMP/published"
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Publish
        env:
          EXCLUSIONS_KEY: ${{ secrets.EXCLUSIONS_KEY }}
        run: >-
          node apps/collector/src/index.ts publish --candidate "$RUNNER_TEMP/run/candidate"
          --report "$RUNNER_TEMP/run/report.json" --data "$RUNNER_TEMP/published"
      - run: git -C "$RUNNER_TEMP/published" push origin data

  pages:
    needs: publish
    # The union of the permissions of the jobs in the called workflow.
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
