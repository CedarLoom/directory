name: Pages

# Builds the site in apps/site on pull requests and, from main, deploys it with GitHub Pages, which serves it at
# /directory/. The site reads the rubrics and the workspace packages, so those are in the paths too.
on:
  push:
    branches: [main]
    paths:
      - "apps/site/**"
      - "packages/**"
      - "rubrics/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/actions/**"
      - ".github/workflows/pages.yml"
  pull_request:
    paths:
      - "apps/site/**"
      - "packages/**"
      - "rubrics/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/actions/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:
  # The refresh deploys the site after each push of the data branch.
  workflow_call:

permissions: {}

# A deploy on main is never cancelled by the next push; it waits. A literal name, as a called workflow reports its
# caller's name: a push and a refresh never deploy at once.
concurrency:
  group: pages-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    if: github.repository == 'CedarLoom/directory'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      # configure-pages reads the Pages settings.
      pages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # A refresh started before the last push to main would otherwise deploy the older commit it started from;
          # push and pull request builds keep their event commit.
          ref: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && github.ref || '' }}
      # Fails before the build when Pages is not enabled for the repository.
      - if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: ./.github/actions/site-build
        with:
          base-url: /directory/
      - if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: apps/site/dist/client

  deploy:
    if: github.repository == 'CedarLoom/directory' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
