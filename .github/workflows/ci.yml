name: CI

# While the repository is private: no dependency review or CodeQL; `pnpm run check` and the gates workflow hold the substitute gates.
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, edited, reopened, synchronize]
  merge_group:
  schedule:
    - cron: "37 5 * * 1" # Monday 05:37, zizmor and the audit on unchanged code
      timezone: Europe/Berlin
permissions: {}
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  gates:
    permissions: { contents: read, pull-requests: read }
    # No repo-standards release holds gates.yml yet; move to the first release that does.
    uses: eikelandin/repo-standards/.github/workflows/gates.yml@e4f18540c9ab319742396897ceb08cadc38e9b27 # main 2026-11-14
    with:
      dependency-review: false
  repository:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The rubric-lock gate compares rubrics/lock.json with the parent commit, the base branch of a pull request.
          fetch-depth: 2
      - uses: ./.github/actions/setup
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: false
      # knip loads the site's Vite config, which reads the data folder.
      - run: cp -R apps/site/fixtures/data apps/site/data
      - run: pnpm run check
  site:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      # The data branch holds the collected data; the site tests run on the fixtures.
      - run: cp -R apps/site/fixtures/data apps/site/data
      - name: The message catalog and the theme match their sources
        run: pnpm --filter @directory/site run messages && pnpm --filter @directory/site run tokens && git diff --exit-code
      - run: pnpm --filter @directory/site run build
      - run: pnpm --filter @directory/site run weight
      - run: pnpm --filter @directory/site run build-storybook
      - run: pnpm --filter @directory/site exec playwright install --with-deps chromium firefox webkit
      - run: pnpm --filter @directory/site run test-storybook
      # The browser tests report on their own, also when the story tests fail.
      - if: ${{ !cancelled() }}
        run: pnpm --filter @directory/site run e2e
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: apps/site/playwright-report
          retention-days: 7
  visual:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:2f05f8a734509a7b3f26a912639488ee08f58a7b292d14d62271bcff9038768f
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: cp -R apps/site/fixtures/data apps/site/data
      - run: pnpm --filter @directory/site run build
      - run: pnpm --filter @directory/site run visual
      # A missing or changed screenshot fails the run; the artifact holds the new ones for review.
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: screenshots
          path: |
            apps/site/e2e/__screenshots__
            apps/site/test-results
          retention-days: 7
  check:
    if: always()
    needs: [gates, repository, site, visual]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35 # v1.3.0
        with:
          jobs: ${{ toJSON(needs) }}
