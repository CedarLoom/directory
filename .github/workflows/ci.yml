name: CI

# While the repository is private: no dependency review or CodeQL; `pnpm run check` and the gates workflow hold the substitute gates.
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, edited, reopened, synchronize]
  merge_group:
  schedule:
    - cron: '37 5 * * 1' # Monday 05:37, zizmor and the audit on unchanged code
      timezone: Europe/Berlin
permissions: {}
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  gates:
    permissions: { contents: read, pull-requests: read }
    # No repo-standards release holds gates.yml yet; move to the first release that does.
    uses: eikelandin/repo-standards/.github/workflows/gates.yml@e4f18540c9ab319742396897ceb08cadc38e9b27 # main 2026-11-14
    with:
      dependency-review: false
  repository:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 12.20.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm run check
  check:
    if: always()
    needs: [gates, repository]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35 # v1.3.0
        with:
          jobs: ${{ toJSON(needs) }}
