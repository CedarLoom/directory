  "@axe-core/playwright": 4.14.0
  "@biomejs/biome": 2.6.7
  "@commander-js/extra-typings": 15.1.0
  "@fontsource-variable/inter": 5.3.0
  "@lingui/cli": 6.11.0
  "@lingui/core": 6.11.0
  "@lingui/react": 6.11.0
  "@lingui/vite-plugin": 6.11.0
  "@mantine/core": 9.7.4
  "@mantine/hooks": 9.7.4
  "@noble/hashes": 2.4.0
  "@playwright/test": 1.64.1
  "@storybook/addon-a11y": 10.6.5
  "@storybook/addon-vitest": 10.6.5
  "@storybook/react-vite": 10.6.5
  "@tanstack/react-router": 1.170.46
  "@tanstack/react-start": 1.169.4
  "@tanstack/react-table": 9.3.1
  "@terrazzo/parser": 2.10.0
  "@terrazzo/plugin-css": 2.10.0
  "@types/node": 26.6.6
  "@types/react": 19.3.0
  "@types/react-dom": 19.3.0
  "@vitejs/plugin-react": 6.2.1
  "@vitest/browser-playwright": 5.1.0
  ajv: 8.20.0
  commander: 15.1.0
  jscpd: 5.4.3
  knip: 6.45.1
  lucide-react: 1.66.0
  oxlint: 1.93.0
  oxlint-tsgolint: 7.0.2007
  playwright: 1.64.1
  react: 19.3.1
  react-dom: 19.3.1
  spdx-license-ids: 3.0.24
  storybook: 10.6.5
  stylelint: 18.0.0
  typescript: 7.0.2
  vite: 8.3.5
  vitest: 5.1.0
  zod: 4.6.7

catalogMode: strict
strictPeerDependencies: true
savePrefix: ""
# Dependency cooldown of 3 days: pnpm resolves no version younger than this, transitive ones included.
minimumReleaseAge: 4320

# picomatch ReDoS with no patched version: reached only by build and dev tools, never by the collector or the published site. Remove when a patched picomatch ships.
auditConfig:
  ignoreGhsas:
    - GHSA-fc5q-39xc-vjpf
