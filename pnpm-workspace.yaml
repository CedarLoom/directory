packages:
  - packages/*
  - apps/*

# One version per dependency across the workspace; packages refer to it as "catalog:".
catalog:
  "@biomejs/biome": 2.6.7
  "@commander-js/extra-typings": 15.1.0
  "@noble/hashes": 2.4.0
  "@types/node": 26.6.6
  commander: 15.1.0
  jscpd: 5.4.3
  knip: 6.45.1
  oxlint: 1.93.0
  oxlint-tsgolint: 7.0.2007
  spdx-license-ids: 3.0.24
  stylelint: 18.0.0
  typescript: 7.0.2
  vitest: 5.1.0
  zod: 4.6.7

catalogMode: strict
strictPeerDependencies: true
savePrefix: ""
# Dependency cooldown of 3 days: pnpm resolves no version younger than this, transitive ones included.
minimumReleaseAge: 4320
